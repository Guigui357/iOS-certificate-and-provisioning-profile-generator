<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YDEV Provision</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.4.0/forge.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(-45deg, #60a5fa, #818cf8, #f472b6, #34d399);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
      color: white;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    input, button {
      padding: 0.75em;
      font-size: 1rem;
      margin-top: 1em;
      border-radius: 6px;
      border: none;
      width: 300px;
      box-sizing: border-box;
    }
    button {
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }
    #status {
      margin-top: 2em;
      font-size: 0.9em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>YDEV Provision</h1>
  <p>Generate your own certificate and mobile provisioning profile.<br>This tool does not use Apple’s infrastructure.</p>

  <input type="text" id="cn" placeholder="Common Name (e.g. YDEV Corp)" /><br>
  <input type="text" id="uuid" placeholder="Seu UUID aqui (ex: E62B1234...)" />
  
  <br>
  <button onclick="generateKey()">Generate Key Pair</button>
  <button onclick="downloadPEM()">Download PEM (Public Key)</button>
  <button onclick="downloadPrivateKey()">Download Private Key</button>
  <button onclick="exportP12()">Export as .P12 (Senha: 1234)</button>
  <button onclick="generateProvision()">Generate .mobileprovision</button>
  <div id="status">Ready.</div>

  <script>
    let publicKey, privateKey, exportedPem, exportedKey;
    const teamId = "NNGHJ36ZX2"; // ID constante sincronizado entre o certificado e o mobileprovision

    async function generateKey() {
      try {
        document.getElementById("status").textContent = "⏳ Generating Key Pair (Please wait)...";
        
        const keyPair = await window.crypto.subtle.generateKey(
          {
            name: "RSASSA-PKCS1-v1_5",
            modulusLength: 2048,
            publicExponent: new Uint8Array([1, 0, 1]), 
            hash: "SHA-256"
          },
          true,
          ["sign", "verify"]
        );
        publicKey = keyPair.publicKey;
        privateKey = keyPair.privateKey;

        exportedPem = await crypto.subtle.exportKey("spki", publicKey);
        exportedKey = await crypto.subtle.exportKey("pkcs8", privateKey);

        document.getElementById("status").textContent = "✅ Key pair generated successfully!";
      } catch (err) {
        document.getElementById("status").textContent = "❌ Error generating keys: " + err.message;
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function formatAsPem(base64Str, header, footer) {
      const lines = base64Str.match(/.{1,64}/g).join('\n');
      return `${header}\n${lines}\n${footer}`;
    }

    function downloadPEM() {
      if (!exportedPem) { alert("Generate key pair first!"); return; }
      const base64 = arrayBufferToBase64(exportedPem);
      const pemText = formatAsPem(base64, "-----BEGIN PUBLIC KEY-----", "-----END PUBLIC KEY-----");
      
      const blob = new Blob([pemText], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "public.pem";
      link.click();
    }

    function downloadPrivateKey() {
      if (!exportedKey) { alert("Generate key pair first!"); return; }
      const base64 = arrayBufferToBase64(exportedKey);
      const pemText = formatAsPem(base64, "-----BEGIN PRIVATE KEY-----", "-----END PRIVATE KEY-----");

      const blob = new Blob([pemText], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "private.key";
      link.click();
    }

    function buildCertificate() {
      const cn = document.getElementById("cn").value || "YDEV Corp";

      const privateKeyObj = forge.pki.privateKeyFromAsn1(forge.asn1.fromDer(forge.util.createBuffer(exportedKey)));
      const publicKeyObj = forge.pki.publicKeyFromAsn1(forge.asn1.fromDer(forge.util.createBuffer(exportedPem)));

      const cert = forge.pki.createCertificate();
      cert.publicKey = publicKeyObj;
      cert.serialNumber = '01';
      cert.validity.notBefore = new Date();
      cert.validity.notAfter = new Date();
      cert.validity.notAfter.setFullYear(cert.validity.notBefore.getFullYear() + 6);

      // CORREÇÃO AQUI: Adicionado organizationalUnitName (OU) com o Team ID real no Subject do Dono
      const subjectAttrs = [
        { name: 'countryName', value: 'US' },
        { name: 'organizationName', value: 'YDEV Corp' },
        { name: 'organizationalUnitName', value: teamId }, 
        { name: 'commonName', value: cn }
      ];
      cert.setSubject(subjectAttrs);

      const issuerAttrs = [
        { name: 'countryName', value: 'US' },
        { name: 'organizationName', value: 'Apple Inc.' },
        { name: 'organizationalUnitName', value: 'Apple Worldwide Developer Relations' },
        { name: 'commonName', value: 'Apple Worldwide Developer Relations Certification Authority' }
      ];
      cert.setIssuer(issuerAttrs);
      
      cert.sign(privateKeyObj);
      return { privateKeyObj, cert };
    }

    function exportP12() {
      if (!exportedKey || !exportedPem) {
        document.getElementById("status").textContent = "❌ Generate key pair first.";
        return;
      }
      
      const { privateKeyObj, cert } = buildCertificate();

      const p12Asn1 = forge.pkcs12.toPkcs12Asn1(privateKeyObj, cert, '1234', { algorithm: '3des' });
      const p12Der = forge.asn1.toDer(p12Asn1).getBytes();
      const blob = new Blob([new Uint8Array(forge.util.createBuffer(p12Der, 'binary').bytes().split('').map(c => c.charCodeAt(0)))], { type: 'application/x-pkcs12' });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = "certificate.p12";
      link.click();

      document.getElementById("status").textContent = "📦 Exported certificate.p12 (Password: 1234)";
    }

    function generateProvision() {
      if (!exportedKey || !exportedPem) {
        document.getElementById("status").textContent = "❌ Generate key pair first e clique em Export .P12.";
        return;
      }

      const cn = document.getElementById("cn").value || "YDEV Corporation";
      const userUuid = document.getElementById("uuid").value.trim() || "E62B1234-5678-ABCD-EF01-123456789ABC";
      
      const { privateKeyObj, cert } = buildCertificate();

      const certDer = forge.asn1.toDer(forge.pki.certificateToAsn1(cert)).getBytes();
      const certBase64 = window.btoa(certDer);

      const xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
<plist version="1.0">
<dict>
  <key>AppIDName</key>
  <string>${cn}</string>
  <key>ApplicationIdentifierPrefix</key>
  <array>
    <string>${teamId}</string>
  </array>
  <key>Platform</key>
  <array>
    <string>iOS</string>
  </array>
  <key>IsXcodeManaged</key>
  <false/>
  <key>DeveloperCertificates</key>
  <array>
    <data>${certBase64}</data>
  </array>
  <key>Entitlements</key>
  <dict>
    <key>application-identifier</key>
    <string>${teamId}.*</string>
    <key>get-task-allow</key>
    <true/>
    <key>keychain-access-groups</key>
    <array>
      <string>${teamId}.*</string>
    </array>
  </dict>
  <key>Name</key>
  <string>${cn} Provision</string>
  <key>ProvisionsAllDevices</key>
  <true/>
  <key>TeamName</key>
  <string>${cn}</string>
  <key>TeamIdentifier</key>
  <array>
    <string>${teamId}</string>
  </array>
  <key>TimeToLive</key>
  <integer>3650</integer>
  <key>UUID</key>
  <string>${userUuid}</string>
  <key>Version</key>
  <integer>1</integer>
  <key>ExpirationDate</key>
  <date>2036-01-01T00:00:00Z</date>
</dict>
</plist>`;

      try {
        const p7 = forge.pkcs7.createSignedData();
        p7.content = forge.util.createBuffer(xmlContent, 'utf8');
        p7.addCertificate(cert);
        
        p7.addSigner({
          key: privateKeyObj,
          certificate: cert,
          digestAlgorithm: forge.oids.sha256
        });
        
        p7.sign({ detached: false });
        
        const p7Der = forge.asn1.toDer(p7.toAsn1()).getBytes();
        const blobData = new Uint8Array(p7Der.split('').map(c => c.charCodeAt(0)));
        
        const blob = new Blob([blobData], { type: "application/x-apple-aspen-config" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "custom.mobileprovision";
        link.click();

        document.getElementById("status").textContent = "📄 .mobileprovision assinado e gerado com sucesso!";
      } catch (e) {
        document.getElementById("status").textContent = "❌ Erro ao assinar Perfil: " + e.message;
      }
    }
  </script>
</body>
</html>
