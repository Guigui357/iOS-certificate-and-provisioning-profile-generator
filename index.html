<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>YDEV Provision</title><style>body{font-family:sans-serif;background:linear-gradient(-45deg,#60a5fa,#818cf8,#f472b6,#34d399);background-size:400% 400%;animation:gradient 15s ease infinite;display:flex;flex-direction:column;align-items:center;padding:2em;color:white}@keyframes gradient{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}input,button{padding:.75em;font-size:1rem;margin-top:1em;border-radius:6px;border:none;width:300px;box-sizing:border-box}button{background:white;color:black;cursor:pointer;font-weight:bold}#status{margin-top:2em;font-size:.9em;white-space:pre-wrap}</style></head><body><h1>YDEV Provision</h1><p>Generate your own certificate and mobile provisioning profile.<br>This tool does not use Apple’s infrastructure.</p><input type="text" id="cn" placeholder="Common Name / Team Name (ex: NEX Enterprises)"><br><input type="text" id="uuid" placeholder="Seu UUID aqui (ex: E62B1234...)"><br><button onclick="generateKey()">Generate Key Pair</button><button onclick="downloadPEM()">Download PEM (Public Key)</button><button onclick="downloadPrivateKey()">Download Private Key</button><button onclick="exportP12()">Export as .P12 (Senha: 1234)</button><button onclick="generateProvision()">Generate .mobileprovision</button><div id="status">Ready.</div><script src="forge.min.js"></script><script>let privateKeyObj,publicKeyObj,exportedPem,exportedKey,globalLeafCert,globalCaCert;const teamId="NEX9876543";async function generateKey(){try{if(typeof forge==="undefined")throw new Error("A biblioteca Forge nao foi carregada.");document.getElementById("status").textContent="⏳ Generating Key Pair & Certificate Chain...";await new Promise((e=>setTimeout(e,100)));const e=document.getElementById("cn").value||"NEX Enterprises";const t=forge.pki.rsa.generateKeyPair({bits:2048,e:65537});privateKeyObj=t.privateKey;publicKeyObj=t.publicKey;exportedPem=forge.asn1.toDer(forge.pki.publicKeyToAsn1(publicKeyObj)).getBytes();exportedKey=forge.asn1.toDer(forge.pki.privateKeyToAsn1(privateKeyObj)).getBytes();const n=forge.pki.rsa.generateKeyPair({bits:2048,e:65537}),r=forge.pki.createCertificate();r.publicKey=n.publicKey;r.serialNumber="00DF4EA630E14A2E";r.validity.notBefore=new Date;r.validity.notAfter=new Date;r.validity.notAfter.setFullYear(r.validity.notBefore.getFullYear()+1);const a=[{name:"countryName",value:"US"},{name:"organizationName",value:"Apple Inc."},{name:"organizationalUnitName",value:"Apple Worldwide Developer Relations"},{name:"commonName",value:"Apple Worldwide Developer Relations Certification Authority"}];r.setSubject(a);r.setIssuer(a);r.setExtensions([{name:"basicConstraints",cA:!0,critical:!0},{name:"keyUsage",digitalSignature:!1,keyCertSign:!0,cRLSign:!0,critical:!0},{name:"subjectKeyIdentifier"}]);r.sign(n.privateKey,forge.md.sha256.create());globalCaCert=r;const o=forge.pki.createCertificate();o.publicKey=publicKeyObj;o.serialNumber="44569BC693A17B45CD730BF23E118A8B";o.validity.notBefore=new Date;o.validity.notAfter=new Date;o.validity.notAfter.setFullYear(o.validity.notBefore.getFullYear()+1);const i=[{name:"countryName",value:"US"},{name:"organizationName",value:e},{name:"organizationalUnitName",value:teamId},{name:"commonName",value:"iPhone Distribution: "+e}];o.setSubject(i);o.setIssuer(a);const c=forge.asn1.toDer(forge.asn1.create(forge.asn1.Class.UNIVERSAL,forge.asn1.Type.SEQUENCE,!0,[])).getBytes();o.setExtensions([{name:"basicConstraints",cA:!1,critical:!0},{name:"keyUsage",digitalSignature:!0,critical:!0},{name:"extKeyUsage",codeSigning:!0,critical:!0,id:"2.5.29.37",value:forge.asn1.toDer(forge.asn1.create(forge.asn1.Class.UNIVERSAL,forge.asn1.Type.SEQUENCE,!0,[forge.asn1.create(forge.asn1.Class.UNIVERSAL,forge.asn1.Type.OID,!1,forge.asn1.oidToDer("1.3.6.1.5.5.7.3.3").getBytes())])).getBytes()},{name:"authorityKeyIdentifier",authorityCertIssuer:!0,authorityCertSerialNumber:!0},{id:"1.2.840.113635.100.6.1.2",critical:!1,value:c},{id:"1.2.840.113635.100.6.1.4",critical:!1,value:c},{id:"1.2.840.113635.100.6.1.1",critical:!1,value:c},{id:"1.2.840.113635.100.6.2.1",critical:!1,value:c}]);o.sign(n.privateKey,forge.md.sha256.create());globalLeafCert=o;document.getElementById("status").textContent="✅ Key pair and unified cert chain generated successfully!"}catch(e){document.getElementById("status").textContent="❌ Error: "+e.message}}function arrayBufferToBinaryString(e){let t="";const n=new Uint8Array(e);for(let e=0;e<n.byteLength;e++)t+=String.fromCharCode(n[e]);return t}function arrayBufferToBase64(e){return window.btoa(arrayBufferToBinaryString(e))}function formatAsPem(e,t,n){return t+"\n"+e.match(/.{1,64}/g).join("\n")+"\n"+n}function downloadPEM(){if(!exportedPem)return alert("Generate key pair first!");const e=arrayBufferToBase64(exportedPem),t=formatAsPem(e,"-----BEGIN PUBLIC KEY-----","-----END PUBLIC KEY-----"),n=new Blob([t],{type:"text/plain;charset=utf-8"}),r=document.createElement("a");r.href=URL.createObjectURL(n);r.download="public.pem";document.body.appendChild(r);r.click();document.body.removeChild(r)}function downloadPrivateKey(){if(!exportedKey)return alert("Generate key pair first!");const e=arrayBufferToBase64(exportedKey),t=formatAsPem(e,"-----BEGIN PRIVATE KEY-----","-----END PRIVATE KEY-----"),n=new Blob([t],{type:"text/plain;charset=utf-8"}),r=document.createElement("a");r.href=URL.createObjectURL(n);r.download="private.key";document.body.appendChild(r);r.click();document.body.removeChild(r)}function exportP12(){try{if(!globalLeafCert||!globalCaCert)return void(document.getElementById("status").textContent="❌ Generate key pair first.");const e=forge.pkcs12.toPkcs12Asn1(privateKeyObj,[globalLeafCert,globalCaCert],"1234",{algorithm:"aes256"}),t=forge.asn1.toDer(e).getBytes(),n=new Blob([new Uint8Array(forge.util.createBuffer(t,"binary").bytes().split("").map((e=>e.charCodeAt(0))))],{type:"application/x-pkcs12"}),r=document.createElement("a");r.href=UR ;e.addSigner({key:privateKeyObj,certificate:globalLeafCert,digestAlgorithm:forge.oids.sha256});e.sign({detached:!1});const t=forge.asn1.toDer(e.toAsn1()).getBytes(),n_bytes=new Uint8Array(t.split("").map((e=>e.charCodeAt(0)))),blob_file=new Blob([n_bytes],{type:"application/x-apple-aspen-config"});const link_dl=document.createElement("a");link_dl.href=URL.createObjectURL(blob_file);link_dl.download="custom.mobileprovision";link_dl.click();document.getElementById("status").textContent="📄 .mobileprovision assinado e gerado com sucesso!"}catch(e){document.getElementById("status").textContent="❌ Erro ao assinar Perfil: "+e.message}}</script></body></html>
