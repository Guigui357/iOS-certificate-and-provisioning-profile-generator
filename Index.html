
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YDEV Provision</title>
  <script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(-45deg, #60a5fa, #818cf8, #f472b6, #34d399);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
      color: white;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    input, button {
      padding: 0.75em;
      font-size: 1rem;
      margin-top: 1em;
      border-radius: 6px;
      border: none;
    }
    button {
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }
    #status {
      margin-top: 2em;
      font-size: 0.9em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>YDEV Provision</h1>
  <p>Generate your own certificate and mobile provisioning profile.<br>This tool does not use Apple’s infrastructure.</p>

  <input type="text" id="cn" placeholder="Common Name (e.g. YDEV Corp)" />
  <button onclick="generateKey()">Generate Key Pair</button>
  <button onclick="downloadPEM()">Download PEM</button>
  <button onclick="downloadPrivateKey()">Download Private Key</button>
  <button onclick="exportP12()">Export as .P12 (No Password)</button>
  <button onclick="generateProvision()">Generate .mobileprovision</button>
  <div id="status">Ready.</div>

  <script>
    let publicKey, privateKey, exportedPem, exportedKey;

    async function generateKey() {
      const keyPair = await window.crypto.subtle.generateKey(
        {
          name: "RSASSA-PKCS1-v1_5",
          modulusLength: 2048,
          publicExponent: new Uint8Array([1, 0, 1]),
          hash: "SHA-256"
        },
        true,
        ["sign", "verify"]
      );
      publicKey = keyPair.publicKey;
      privateKey = keyPair.privateKey;

      exportedPem = await crypto.subtle.exportKey("spki", publicKey);
      exportedKey = await crypto.subtle.exportKey("pkcs8", privateKey);

      document.getElementById("status").textContent = "✅ Key pair generated.";
    }

    function downloadPEM() {
      if (!exportedPem) return;
      const blob = new Blob([exportedPem], { type: "application/octet-stream" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "public.pem";
      link.click();
    }

    function downloadPrivateKey() {
      if (!exportedKey) return;
      const blob = new Blob([exportedKey], { type: "application/octet-stream" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "private.key";
      link.click();
    }

    function exportP12() {
      const cn = document.getElementById("cn").value || "YDEV Corp";

      const privateKeyObj = forge.pki.privateKeyFromAsn1(forge.asn1.fromDer(forge.util.createBuffer(exportedKey)));
      const publicKeyObj = forge.pki.publicKeyFromAsn1(forge.asn1.fromDer(forge.util.createBuffer(exportedPem)));

      const cert = forge.pki.createCertificate();
      cert.publicKey = publicKeyObj;
      cert.serialNumber = '01';
      cert.validity.notBefore = new Date();
      cert.validity.notAfter = new Date();
      cert.validity.notAfter.setFullYear(cert.validity.notBefore.getFullYear() + 6);

      const attrs = [{ name: 'commonName', value: cn }];
      cert.setSubject(attrs);
      cert.setIssuer(attrs);
      cert.sign(privateKeyObj);

      const p12Asn1 = forge.pkcs12.toPkcs12Asn1(privateKeyObj, cert, '', { algorithm: '3des' });
      const p12Der = forge.asn1.toDer(p12Asn1).getBytes();
      const blob = new Blob([new Uint8Array(forge.util.createBuffer(p12Der, 'binary').bytes().split('').map(c => c.charCodeAt(0)))], { type: 'application/x-pkcs12' });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = "certificate.p12";
      link.click();

      document.getElementById("status").textContent = "📦 Exported certificate.p12";
    }

    function generateProvision() {
      const cn = document.getElementById("cn").value || "YDEV Corporation";
      const mobileProvision = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>AppIDName</key><string>${cn}</string>
  <key>Platform</key><array><string>iOS</string></array>
  <key>IsXcodeManaged</key><false/>
  <key>TeamName</key><string>${cn}</string>
  <key>ExpirationDate</key><date>2031-01-01T00:00:00Z</date>
</dict>
</plist>`;

      const blob = new Blob([mobileProvision], { type: "application/xml" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "custom.mobileprovision";
      link.click();

      document.getElementById("status").textContent = "📄 Provisioning profile generated.";
    }
  </script>
</body>
</html>
